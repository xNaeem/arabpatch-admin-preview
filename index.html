اتها... وزعمت أنّ لنا مقامًا فوق سائر الفانين... لقد كذبت...","explanation":"صغت الادّعاء على أنه زعم بالتفوّق على الفانين.","preservedOutcome":"يبقى واضح إن النسّاجة تتذكّر الوعد القديم وتصفه بالكذب.","context":"ذكرى قصيرة من كلام إحدى النسّاجات."}]},"examples":[{"category":"interface","title":"متى يفيدك الحرير؟","sourceText":"Versatile thread naturally produced within the shell. When enough Silk is stored, wounds can be healed and skills executed.<br><br>Attack enemies to replenish Silk.","context":"وصف الحرير في شاشة المقتنيات.","finalArabic":"خيطٌ متعدّد الاستخدامات يتكوّن طبيعيًّا داخل القوقعة. إذا خزّنت ما يكفي من الحرير، أمكنك تضميد جراحك واستخدام المهارات.<br><br>هاجم الأعداء لاستعادة الحرير.","explanation":"بدأت الوصف بمصدر الحرير، وبعده وضّحت الشرط. إذا صار معك حرير كفاية، تقدر تضمّد جراحك وتستخدم مهاراتك.","playerOutcome":"تعرف إن التضميد والمهارات تحتاج كمية كافية من الحرير.","screenshotIndex":2,"passage":{"english":"Versatile thread naturally produced within the shell. When enough Silk is stored, wounds can be healed and skills executed.","arabic":"خيطٌ متعدّد الاستخدامات يتكوّن طبيعيًّا داخل القوقعة. إذا خزّنت ما يكفي من الحرير، أمكنك تضميد جراحك واستخدام المهارات."}},{"category":"context","title":"التاجرة وساعي البريد","sourceText":"<hpage>Greetings, shopkeeper. I’d ask to trade, but your store seems a little bare.<page>Ahem! Well, yes. Our little town’s seen some dire times, and now my courier’s gone and got themself lost.<page>But don’t worry! I’ve a few small things, still! And if that courier ever makes it safely back, we’ll have plenty more treasures to haggle over.","context":"هورنت تمرّ على تاجرة في البلدة وتلاحظ إن بضائعها قليلة.","finalArabic":"<hpage>تحياتي، أيتها التاجرة. كنت أود أن أطلب المقايضة، لكن متجركِ يبدو فارغًا بعض الشيء.<page>احم! حسناً، نعم. لقد شهدت بلدتنا الصغيرة أوقاتاً عصيبة، والآن ضاع ساعي البريد الخاص بي.<page>لكن لا تقلقي! لا يزال لدي بعض الأشياء الصغيرة! وإذا تمكن ذلك الساعي من العودة بأمان، سيكون لدينا الكثير من الكنوز الإضافية للمساومة عليها.","explanation":"خلّيت التاجرة تطمّن هورنت إن عندها بعض الأغراض. بعدها تربط وفرة البضائع بعودة الساعي بالسلامة.","playerOutcome":"تفهم ليش متجرها شبه فاضي وش اللي ممكن يغيّر وضعه.","passage":{"english":"But don’t worry! I’ve a few small things, still! And if that courier ever makes it safely back, we’ll have plenty more treasures to haggle over.","arabic":"لكن لا تقلقي! لا يزال لدي بعض الأشياء الصغيرة! وإذا تمكن ذلك الساعي من العودة بأمان، سيكون لدينا الكثير من الكنوز الإضافية للمساومة عليها."}},{"category":"context","title":"فارلوم فوق قشور قديمة","sourceText":"Crumbling roads built upon the shells of ancient bugs. All of Pharloom rests upon these fragile foundations.","context":"الوصف اللي يجي مع خريطة المنطقة.","finalArabic":"طرقٌ متداعية بُنيت فوق قشور حشرات قديمة. كلُّ فارلوم ترتكز على هذه القواعد الهشة.","explanation":"أبقيت صورة الطرق فوق قشور الحشرات القديمة، وبعدها ربطتها بفارلوم كلها مثل الأصل.","playerOutcome":"تعرف طبيعة المنطقة من وصف الخريطة وتفهم ليه أساسها هشّ.","passage":{"english":"Crumbling roads built upon the shells of ancient bugs. All of Pharloom rests upon these fragile foundations.","arabic":"طرقٌ متداعية بُنيت فوق قشور حشرات قديمة. كلُّ فارلوم ترتكز على هذه القواعد الهشة."}}]},"releases":[{"version":"1.5.0","gameVersion":"1.0.30000","gameVersionDisplay":"1.0.30000","translatedWordCount":81614,"platforms":["Steam"],"publishedAt":"2026-11-18","lastVerified":"2026-11-18","status":"complete","tag":"hollow-knight-silksong-v1.5.0","filename":"ArabPatch-Hollow-Knight-Silksong-Arabic-v1.5.0.zip","url":"https://downloads.arabpatch.com/hollow-knight-silksong-v1.5.0/ArabPatch-Hollow-Knight-Silksong-Arabic-v1.5.0.zip","bytes":31025492,"sha256":"5d9f657d1e3f39c329e0e7f00046b93c2e250ac69a5b85f4997e00bc1eba10e1","changelog":["الإصدار الأول للتعريب. يشمل الحوارات والمهام والقوائم والخرائط وأوصاف المقتنيات والمهارات.","عرّبت شعار شاشة البداية وعناوين الفصول، واعتمدت خط Katibeh للنصوص العربية.","ضبطت ترتيب أسطر الوصف من اليمين، مثل شرح zationQuality":{"introduction":"هذي أمثلة من نصوص اللعبة. قارنت الأصل الصيني بالنص الإنجليزي والعربية المعتمدة، ووضّحت سبب الصياغة في كل مثال.","beliefAdaptation":{"applied":true,"examples":[{"sourceText":"Defy heaven's will. Death waits around every corner.","original":{"language":"zh-Hans","text":"逆天而行，九死一生"},"finalArabic":"تحدَّ المخاطر. الموت يتربص في كل زاوية.","explanation":"استبدلت تحدي إرادة السماء بتحدي المخاطر. بقي تحذير اللاعب من الموت والخطر في كل زاوية.","preservedOutcome":"الوصف ما زال يوضح شدة التحدي.","context":"وصف الصعوبة في شاشة اختيار مستوى التحدي."},{"sourceText":"An ancient ritual vessel once used by orthodox sects to worship gods and Buddha. After it was smashed, more and more among the Mandate came to worship the Lady of the Veil instead.\n\nYet there were always those who refused to change their words, who refused to forget. The glory of the Mandate of old still shone upon their weapons.","original":{"language":"zh-Hans","text":"旧时名门正派祭祀神佛的礼器，被砸毁后，正道中信奉蒙花圣母娘娘之人，便越发多了。\n\n但总有人不愿改口，不肯遗忘。昔日正道的辉煌，仍映在他们的兵刃上。"},"finalArabic":"وعاء طقوس قديم استخدمته طوائف النهج القويم ذات يوم في طقوسها القديمة. وبعد تحطمه، بدأ المزيد والمزيد من أتباع التفويض في اتباع سيدة الحجاب بدلاً من ذلك.\n\nومع ذلك، كان هناك دائماً أولئك الذين رفضوا تغيير كلماتهم، ورفضوا النسيان. فما زال مجد التفويض القديم يلمع على أسلحتهم.","explanation":"عدّلت إسناد العبادة إلى وصف الطقوس والاتباع. حافظت على تحطم الوعاء، وتحول الولاء، ومن رفضوا نسيان ماضي التفويض.","preservedOutcome":"تسلسل الأحداث وصلته بالأسلحة باقيان في النص.","context":"وصف وعاء طقوس قديم، وما صار لأتباع التفويض بعد تحطمه."},{"sourceText":"The illusionist who brought him to the ruins said that disciples who made mistakes had to walk barefoot through the snow. The cold and the whiteness would wash away their karmic burden, and the walk itself was the High Elder's test of a disciple's faith.","original":{"language":"zh-Hans","text":"带他前来遗迹的幻术师说，犯了错的弟子，须赤着脚，行于雪中。冰冷与洁白可洗濯业障，更是至高尊者对弟子们信念的考验。"},"finalArabic":"قال له ساحر الأوهام الذي أحضره إلى الأطلال إن على التلاميذ الذين ارتكبوا أخطاءً أن يسيروا حفاةً عبر الثلوج. فمن شأن البرد والبياض أن يخففا عبء أخطائهم، وكان السير في حد ذاته اختباراً من الشيخ الأكبر لثبات التلميذ.","explanation":"عدّلت ربط العقوبة بالكارما والإيمان العقدي إلى عبء الأخطاء وثبات التلميذ. بقي السير حافيًا في الثلج واختبار الشيخ الأكبر.","preservedOutcome":"ظلت العقوبة وشدتها ودور الشيخ واضحة.","context":"وصف عقوبة التلاميذ بالسير حفاة في الثلج عند الأطلال."},{"sourceText":"But fate is cruel... what use are riches if you can't keep your life?","original":{"language":"zh-Hans","text":"可惜天有不测，命都保不住，藏下再多的奇珍异宝，又有何益？"},"finalArabic":"لكن الظروف قاسية... فما نفع الثراء إن لم تستطع الاحتفاظ بحياتك؟","explanation":"استبدلت ذم القدر بوصف قسوة الظروف. بقي تحسر المتحدث وسؤاله عن نفع الثراء إذا خسر حياته.","preservedOutcome":"نبرة الحسرة والمقابلة بين المال والحياة محفوظتان.","context":"حوار يقابل فيه المتحدث بين ثروته والخوف على حياته."}]},"examples":[{"category":"context","title":"ضربات تهطل كالمطر","sourceText":"A pair of short-handled twin blades crafted by Forge from the same material as Sanguine. Their attacks fall like rain, unmatched in speed.","context":"وصف التوأم الدموي في شاشة تجهيز الأسلحة، فوق قائمة حركاته.","finalArabic":"نصلان توأمان بمقبضين قصيرين، صنعتهما فورج من مادة سلاح «دموي» نفسها. تهطل ضرباتهما كالمطر، بسرعة لا تُجارى.","explanation":"اخترت «تهطل ضرباتهما كالمطر» عشان تبقى صورة الهجمات المتتابعة وسرعتها واضحة. و«المادة نفسها» تربط النصلين بسلاح دموي، مثل الأصل.","playerOutcome":"تفهم صلة النصلين بسلاح دموي، وتلتقط طابع هجماتهما السريعة.","screenshotIndex":0,"passage":{"english":"A pair of short-handled twin blades crafted by Forge from the same material as Sanguine. Their attacks fall like rain, unmatched in speed.","arabic":"نصلان توأمان بمقبضين قصيرين، صنعتهما فورج من مادة سلاح «دموي» نفسها. تهطل ضرباتهما كالمطر، بسرعة لا تُجارى.","original":{"language":"zh-Hans","text":"炼邪以黑伤材料仿制的短柄双刃，攻势如雨，迅捷无伦。"}}},{"category":"context","title":"متى تتحول الضربة إلى هجمة معززة؟","sourceText":"<InputAction id=\"HeavyAttack\" height=\"26\" RightPadding=\"5\" LeftPadding=\"0\"/><InputAction id=\"HeavyAttack\" height=\"26\" RightPadding=\"5\" LeftPadding=\"0\"/><InputAction id=\"HeavyAttack\" height=\"26\" RightPadding=\"5\" LeftPadding=\"0\"/><InputAction id=\"HeavyAttack\" height=\"26\" RightPadding=\"5\" LeftPadding=\"0\"/>\nCan be unleashed after any swing during a Standard Combo. With enough Sha-Chi, it becomes an enhanced attack with increased damage and Guard Break.","context":"شرح سلسلة هجمات شا تشي أسفل وصف التوأم الدموي؛ تظهر أربعة أزرار للهجوم الثقيل.","finalArabic":"<InputAction id=\"HeavyAttack\" height=\"26\" RightPadding=\"5\" LeftPadding=\"0\"/><InputAction id=\"HeavyAttack\" height=\"26\" RightPadding=\"5\" LeftPadding=\"0\"/><InputAction id=\"HeavyAttack\" height=\"26\" RightPadding=\"5\" LeftPadding=\"0\"/><InputAction id=\"HeavyAttack\" height=\"26\" RightPadding=\"5\" LeftPadding=\"0\"/>\nيمكن إطلاقها بعد أي ضربة خلال سلسلة هجمات عادية. ومع توفر كمية كافية من الشا تشي، تتحول إلى هجمة معززة بضرر أكبر وقدرة على كسر الحراسة.","explanation":"فصلت وقت تنفيذ الحركة عن شرط تقويتها: تقدر تطلقها بعد أي ضربة في السلسلة، لكن زيادة الضرر وكسر الحراسة تحتاج كمية كافية من الشا تشي.","playerOutcome":"تعرف متى تنفذ الحركة، وما الذي تحتاجه حتى تحصل على نسختها المعززة.","screenshotIndex":0,"passage":{"english":"Can be unleashed after any swing during a Standard Combo. With enough Sha-Chi, it becomes an enhanced attack with increased damage and Guard Break.","arabic":"يمكن إطلاقها بعد أي ضربة خلال سلسلة هجمات عادية. ومع توفر كمية كافية من الشا تشي، تتحول إلى هجمة معززة بضرر أكبر وقدرة على كسر الحراسة.","original":{"language":"zh-Hans","text":"可接在任意段数的普通攻击后放出，自身杀气充足则会放出强化攻击，具备更强的伤害和破防能力。"}}},{"category":"context","title":"قواعد واضحة ومنظمة يحيط بها الغموض","sourceText":"The Order is simply the Order. It has no other name.\n\nThe Order kills those no one else can kill. It saves those no one else can save.\n\nThe Order upholds the \"rules\" recognized throughout the Wulin. It concerns itself with fairness, rejecting the belief that good and evil must always stand opposed, and judging both by the same standard.\n\nGuided by this principle, founder Mu Tianmiao spent decades growing what began as an organization of just three people. To this day, the pressure exerted by the Order in enforcing the \"Rules\" can be felt throughout the Wulin, yet little is known of how the Order itself truly operates.","context":"كتاب المنظمة في الأرشيف، من تعريف اسمها إلى تاريخ المؤسس مو تيانمياو.","finalArabic":"إن \"المنظمة\" هي ببساطة \"المنظمة\". ليس لها اسم آخر.\n\nتقضي المنظمة على من لا يستطيع غيرها قتله، وتنقذ من لا يستطيع غيرها إنقاذه.\n\nتلتزم \"المنظمة\" بـ \"القواعد\" المعترف بها في جميع أنحاء الوولين. وهي تهتم بالعدالة، وترفض الاعتقاد بأن الخير والشر يجب أن يكونا دائمًا متقابلين، وتحكم على كليهما بالمعيار نفسه.\n\nبناءً على هذا المبدأ، قضى المؤسس مو تيانمياو عقوداً في تنمية ما بدأ كمنظمة مكونة من ثلاثة أشخاص فقط. وحتى يومنا هذا، يمكن الشعور بالضغط الذي تمارسه المنظمة في فرض \"القواعد\" في جميع أنحاء وولين، ومع ذلك، لا يُعرف إلا القليل عن كيفية عمل المنظمة نفسها حقاً.","explanation":"حافظت على تكرار اسم «المنظمة» وعلى المقابلة بين القتل والإنقاذ. الفقرة تعرّفك بدورها، وتترك طريقة عملها وأسرارها لبقية القصة.","playerOutcome":"تفهم مكانة المنظمة وقواعدها في العالم، مع بقاء الغموض المحيط بعملها.","screenshotIndex":2,"passage":{"english":"The Order is simply the Order. It has no other name.\n\nThe Order kills those no one else can kill. It saves those no one else can save.","arabic":"إن \"المنظمة\" هي ببساطة \"المنظمة\". ليس لها اسم آخر.\n\nتقضي المنظمة على من لا يستطيع غيرها قتله، وتنقذ من لا يستطيع غيرها إنقاذه.","original":{"language":"zh-Hans","text":"“组织”就是“组织”，它没有别的名字。\n\n“组织”杀人，杀别人杀不了的人；“组织”也救人，救别人救不了的人。"}}},{"category":"context","title":"حراس بلا ملامح، لكنهم ليسوا أصحاب الأقنعة","sourceText":"The Order's killers are highly trained and ruthlessly efficient. Wielding broad, double-ended blades, they unleash relentless attacks to overwhelm their foes at close range.\n\nShadow Wardens have no facial features, only black, hollow voids. Yet they wear no masks, nor do they share the Maskwalkers' bloodthirsty madness. They are little more than violet shadows, lurking in the darkness and coming and going without a trace.\n\nLately, however, these shadows seem to be appearing more and more often throughout the Wulin.","context":"وصف حارس الظلال في معرض الأعداء، بجانب صورته ذات الوجه الأسود الخالي من الملامح.","finalArabic":"يتمتع قتلة \"المنظمة\" بتدريب عالٍ وكفاءة لا تعرف الرحمة. وباستخدامهم لنصال عريضة مزدوجة الأطراف، يشنون هجمات متواصلة لسحق أعدائهم في القتال القريب.\n\nلا يمتلك \"حراس الظلال\" أي ملامح وجه، بل مجرد فراغات سوداء جوفاء. ومع ذلك، فهم لا يرتدون أقنعة، ولا يشاطرون \"أصحاب الأقنعة\" جنونهم المتعطش للدماء. إنهم مجرد ظلال بنفسجية، يتربصون في الظلام ويظهرون ويختفون دون أثر.\n\nبيد أن هذه الظلال بدأت تظهر بشكل متزايد في أرجاء \"وولين\" مؤخرًا.","explanation":"أبقيت التفريق واضحًا: الحراس بلا ملامح، لكنهم ما يلبسون أقنعة ولا يحملون جنون أصحاب الأقنعة. كذا ما تختلط عليك المجموعتان.","playerOutcome":"تميّز حراس الظلال عن أصحاب الأقنعة، وتفهم صلتهم بالمنظمة.","screenshotIndex":5,"passage":{"english":"Shadow Wardens have no facial features, only black, hollow voids. Yet they wear no masks, nor do they share the Maskwalkers' bloodthirsty madness. They are little more than violet shadows, lurking in the darkness and coming and going without a trace.","arabic":"لا يمتلك \"حراس الظلال\" أي ملامح وجه، بل مجرد فراغات سوداء جوفاء. ومع ذلك، فهم لا يرتدون أقنعة، ولا يشاطرون \"أصحاب الأقنعة\" جنونهم المتعطش للدماء. إنهم مجرد ظلال بنفسجية، يتربصون في الظلام ويظهرون ويختفون دون أثر.","original":{"language":"zh-Hans","text":"鬼差面无五官，只有漆黑的空洞。但他们不戴面具，也非“怪面”那般嗜血疯狂。他们只是一道道幽紫的鬼影，潜行暗处，来去无踪。"}}},{"category":"context","title":"نزال بلا شهود وآثاره على العتاد","sourceText":"Light traveling gear, left worn and tattered by a duel that shook heaven and earth with no one there to witness it. Even so, it still moves as one with Soul's footwork.","context":"وصف مظهر بلاك سكار (هارب) في شاشة المظهر.","finalArabic":"عتاد سفر خفيف، تظهر عليه آثار التآكل والتمزق جراء نزالٍ زلزل الأرض والسماء ولم يشهد عليه أحد. ومع ذلك، لا يزال يتحرك بتناغم تام مع خطوات سول.","explanation":"حافظت على مبالغة «زلزل الأرض والسماء»، وعلى أن النزال ما شهده أحد. وبقي الوصف عن العتاد وتناسقه مع حركة سول، من غير إضافة فائدة قتالية.","playerOutcome":"تفهم سبب مظهر العتاد البالي، مع بقاء سر النزال كما تركته القصة.","screenshotIndex":9,"passage":{"english":"Light traveling gear, left worn and tattered by a duel that shook heaven and earth with no one there to witness it. Even so, it still moves as one with Soul's footwork.","arabic":"عتاد سفر خفيف، تظهر عليه آثار التآكل والتمزق جراء نزالٍ زلزل الأرض والسماء ولم يشهد عليه أحد. ومع ذلك، لا يزال يتحرك بتناغم تام مع خطوات سول.","original":{"language":"zh-Hans","text":"轻便的行装，历经那场惊天动地却无人见证的对决后，已然残破，但仍与魂的身法相得益彰。"}}}]},"releases":[{"version":"3.0.0","gameVersion":"1.0302256","gameVersionDisplay":"1.0302256","platforms":["Steam"],"publishedAt":"2026-11-17","lastVerified":"2026-11-17","status":"experimental","tag":"phantom-blade-zero-v3.0.0","filename":"ArabPatch-Phantom-Blade-Zero-Arabic-v3.0.0.zip","url":"https://downloads.arabpatch.com/phantom-blade-zero-v3.0.0/ArabPatch-Phantom-Blade-Zero-Arabic-v3.0.0.zip","bytes":3625719,"sha256":"6712936ea2c712bb03e8e033b0c055c0124ba35752eb6d2e221cb148aa5bf1c1","changelog":["إصلاح انتقال نصوص خيارات الإعدادات إلى أقصى اليمين عند تحديدها.","إعادة نصوص الأزرار والاختيارات إلى مواضعها الأصلية، مع الحفاظ على محاذاة الشروحات في الجهة اليمنى.","تصحيح موضع أسماء المناطق في الخريطة.","ضبط تمركز نصوص خيارات الصعوبة وثبات مواضعها عند التحديد وإلغاء التحديد."]},{"version":"2.5.7","gameVersion":"1.0302256","gameVersionDisplay":"1.0302256","translatedWordCount":122865,"platforms":["Steam"],"publishedAt":"2026-11-07","lastVerified":"2026-11-07","status":"experimental","tag":"phantom-blade-zero-v2.5.7","filename":"ArabPat لأوريليا قط في بعض أجزاء باريا.","explanation":"استخدمت «الهدايا» و«الولاء لأوريليا» بدل الإشارة إلى القرابين وعبادتها.","preservedOutcome":"بقي وجود الضريح والهدايا الحديثة واستمرار الولاء في بعض مناطق باريا واضحًا.","context":"وصف هدايا وُضعت حديثًا أمام ضريح أوريليا في بعض مناطق باريا."},{"sourceText":"Even now, they have desecrated our Shrines to Aurelia, torn down our places of study and worship. They have even emptied our graveyards and burned the corpses of the Faithful. \nWe need you by our side. \nSay you will join us.","finalArabic":"حتى الآن، خرّبوا مزارات أوريليا وهدموا أماكن دراستنا واجتماعنا. بل أفرغوا مقابرنا وأحرقوا جثث الموالين. \nنحتاج إليك إلى جانبنا. \nقل إنك ستنضم إلينا.","explanation":"استخدمت «أماكن دراستنا واجتماعنا» و«الموالين» في وصف الجماعة، مع إبقاء الاعتداءات وطلب الانضمام واضحين.","preservedOutcome":"بقي تخريب المزارات وإفراغ المقابر وحرق الجثث والحاجة إلى مساندة رودريك ضمن الحدث نفسه.","context":"كاستوس يعدد الاعتداءات على مزارات أوريليا وأماكن الجماعة ومقابرها، ويطلب من رودريك الانضمام إليهم."}]},"examples":[{"category":"context","title":"العقد يغيّر مصير الأرض","sourceText":"Baron, according to the lease, the Barony of Loth must maintain the roads to and from the leasehold of Comfrey. As you are in breach of the contract, there will be no payment, and the land now defaults to the merchant house of Fairbrand.","context":"حوار عن أرض كومفري المؤجّرة لبيت تجارة فيربراند، بعد الإخلال بشرط صيانة الطرق.","finalArabic":"أيها البارون، وفقاً لعقد الإيجار، يجب على بارونية لوث صيانة الطرق المؤدية إلى أرض إيجار كومفري والعائدة منها. وبما أنك قد انتهكت العقد، فلن يتم دفع أي مبالغ، وتؤول الأرض الآن إلى بيت تجارة فيربراند.","explanation":"استخدمت «تؤول الأرض» لمعنى defaults to في سياق العقد. بقي تسلسل الخلاف واضحًا: صيانة الطرق شرط في الإيجار، والإخلال به أدى إلى رفض الدفع وانتقال الأرض إلى بيت التجارة.","playerOutcome":"تفهم سبب رفض الدفع وكيف صار النزاع متعلقًا بالأرض نفسها.","passage":{"english":"Baron, according to the lease, the Barony of Loth must maintain the roads to and from the leasehold of Comfrey. As you are in breach of the contract, there will be no payment, and the land now defaults to the merchant house of Fairbrand.","arabic":"أيها البارون، وفقاً لعقد الإيجار، يجب على بارونية لوث صيانة الطرق المؤدية إلى أرض إيجار كومفري والعائدة منها. وبما أنك قد انتهكت العقد، فلن يتم دفع أي مبالغ، وتؤول الأرض الآن إلى بيت تجارة فيربراند."}},{"category":"context","title":"الرقم يحدد حجم المجموعة الجديدة","sourceText":"Tip: While having the mouse cursor over one of your wielder's troops, press 1-9 to split that number of units off into a new troop slot.","context":"نصيحة تشرح تقسيم مجموعة قوات باستخدام مؤشر الماوس ومفاتيح الأرقام.","finalArabic":"نصيحة: ضع مؤشر الماوس فوق إحدى مجموعات قوات حامل الجوهر واضغط مفتاحًا من 1-9. ينفصل من المجموعة عدد من الوحدات يساوي الرقم الذي ضغطته، وينتقل إلى خانة قوات جديدة.","explanation":"فصلت التعليمات إلى خطوة وضحّت فيها موضع المؤشر والمفتاح، ثم نتيجة الضغط: الرقم هو عدد الوحدات التي تنفصل وتنتقل إلى خانة جديدة.","playerOutcome":"تعرف أين تضع المؤشر وكيف تختار عدد الوحدات قبل تقسيم المجموعة.","passage":{"english":"Tip: While having the mouse cursor over one of your wielder's troops, press 1-9 to split that number of units off into a new troop slot.","arabic":"نصيحة: ضع مؤشر الماوس فوق إحدى مجموعات قوات حامل الجوهر واضغط مفتاحًا من 1-9. ينفصل من المجموعة عدد من الوحدات يساوي الرقم الذي ضغطته، وينتقل إلى خانة قوات جديدة."}},{"category":"context","title":"عقد أخير وعواقب أبعد","sourceText":"The old tinkerer Bihgli Satherdown had one last contract to complete to clear his family's debt and become a free man. Little did he know that his actions and choices would have far larger consequences.","context":"نبذة حملة باريا في شاشة اختيار الحملات؛ يسعى بيغلي إلى تسديد ديون عائلته والحصول على حريته.","finalArabic":"كان لدى المصلح العجوز بيغلي ساذرداون عقد أخير لإنجازه لتسديد ديون عائلته ويصبح رجلاً حراً. لم يكن يعلم أن أفعاله وخياراته ستكون لها عواقب أكبر بكثير.","explanation":"أبقيت « r her banner no terror can break their spirit.","finalArabic":"فريا محاربة وكاهنة لامستها رياح خارقة. تنتصب محاربات الدروع حين تتكلم، ويزيد أثرها فيهن دفاعاتهن صلابةً. يلقّبنها بصخرة تروندهايم، وتحت رايتها لا يكسر أي رعب عزيمتهن.","explanation":"استُبدل وصف الرياح بالإلهية بوصفها خارقة، وربط تقوية الدفاعات بأثر فريا في محارباتها.","preservedOutcome":"بقي دور الشخصية ولقب صخرة تروندهايم وصلابة الدفاع والثبات أمام الرعب.","context":"وصف شخصية فريا ومحاربات الدروع."},{"sourceText":"The first time an Olympian squad's morale starts wavering, Olympus answers: lightning strikes every enemy model within {0} units of it for {1} damage.","finalArabic":"عند أول اهتزاز لمعنويات فرقة من عصبة أوليمبوس، تُلحق الصاعقة {1} نقطة ضرر بكل فرد عدو ضمن مسافة {0} وحدة منها.","explanation":"حُذفت نسبة الاستجابة إلى أوليمبوس، وبقيت الصاعقة بوصفها أثر القدرة داخل اللعبة.","preservedOutcome":"بقي أول اهتزاز للمعنويات شرطًا للتفعيل، مع مسافة التأثير وقيمة الضرر وعدد الأعداء المتأثرين.","context":"وصف قدرة عصبة أوليمبوس عند اهتزاز المعنويات."},{"sourceText":"Your efforts to treat the sick are successful! As a gesture of gratitude you are offered an artifact worshiped by the peasants.","finalArabic":"تنجح جهودك في علاج المرضى! وامتنانًا لك، يعرض عليك الفلاحون أثرًا عزيزًا عليهم.","explanation":"استُبدل وصف عبادة الفلاحين للأثر بأنه عزيز عليهم.","preservedOutcome":"بقي نجاح العلاج وامتنان الفلاحين وتقديم الأثر مكافأةً على المساعدة.","context":"نتيجة نجاح علاج المرضى في حدث القرية الموبوءة."}]},"examples":[{"category":"context","title":"قرار صفقة الساحرة","sourceText":"A witch offers you a powerful item, but only if you perform a dark deed for her. Her eyes, dark and unyielding, watch for your reaction, as the weight of your choice hangs heavy in the air of her shadowy, herb-scented lair.","context":"وصف حدث صفقة الساحرة قبل اختيار التضحية أو صرف الساحرة أو توكيل المهمة.","finalArabic":"تعرض عليك ساحرة غرضًا قويًا بشرط أن تقوم بعمل مظلم من أجلها. تترقّب رد فعلك بعينين داكنتين لا تلينان، ووطأة قرارك تملأ وكرها المعتم الذي تفوح منه رائحة الأعشاب.","explanation":"اخترت هالصياغة لأنها تربط الغرض القوي بشرط العمل المظلم، وتحافظ على ترقّب الساحرة وثقل القرار ووصف وكرها.","playerOutcome":"تقرأ شرط الصفقة وجو المشهد قبل ما تختار ردك.","screenshotIndex":4,"passage":{"english":"A witch offers you a powerful item, but only if you perform a dark deed for her. Her eyes, dark and unyielding, watch for your reaction, as the weight of your choice hangs heavy in the air of her shadowy, herb-scented lair.","arabic":"تعرض عليك ساحرة غرضًا قويًا بشرط أن تقوم بعمل مظلم من أجلها. تترقّب رد فعلك بعينين داكنتين لا تلينان، ووطأة قرارك تملأ وكرها المعتم الذي تفوح منه رائحة الأعشاب."}},{"category":"context","title":"غنيمة واحدة بعد الفوز","sourceText":"After a victory you can take one spoil of war: Ransom Captives for gold, or Conscript Survivors to recruit one of the beaten enemy units at reduced health. Some heroes add their own choice. Taking one removes the others.","context":"شرح خيارات غنائم الحرب في دليل اللعب بعد الانتصار.","finalArabic":"بعد الفوز يمكنك أخذ غنيمة حرب واحدة. أطلق الأسرى مقابل فدية لتحصل على الذهب، أو جنّد الناجين لتضم إحدى وحدات العدو المهزومة بصحة منخفضة. يضيف بعض الأبطال خيارًا خاصًا بهم. إذا أخذت غنيمة، تسقط الخيارات الأخرى.","explanation":"وضّحت الصياغة أن اختيار الفدية يعطيك ذهبًا، وأن تجنيد الناجين يضم وحدة بصحة منخفضة. وبقي تنبيه أخذ غنيمة واحدة وإلغاء الخيارات الباقية.","playerOutcome":"تعرف وش تكسب من كل خيار، وأنك ما تقدر تجمع كل الغنائم.","passage":{"english":"After a victory you can take one spoil of war: Ransom Captives for gold, or Conscript Survivors to recruit one of the beaten enemy units at reduced health. Some heroes add their own choice. Taking one removes the others.","arabic":"بعد الفوز يمكنك أخذ غنيمة حرب واحدة. أطلق الأسرى مقابل فدية لتحصل على الذهب، أو جنّد الناجين لتضم إحدى وحدات العدو المهزومة بصحة منخفضة. يضيف بعض الأبطال خيارًا خاصًا بهم. إذا أخذت غنيمة، تسقط الخيارات الأخرى."}},{"category":"context","title":"حفظ ماء الوجه بعد الخس
